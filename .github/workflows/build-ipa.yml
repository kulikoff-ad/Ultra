name: Build UltraTools IPA

on:
  push:
    branches: [main, "arena/**"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List schemes
        run: xcodebuild -project UltraTools.xcodeproj -list

      - name: Archive
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -project UltraTools.xcodeproj \
            -scheme UltraTools \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/UltraTools.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee build/xcodebuild.log

      - name: Report build errors
        if: failure()
        run: |
          if [ -f build/xcodebuild.log ]; then
            grep -E "error:|\*\* ARCHIVE FAILED" build/xcodebuild.log | sort -u | head -20 | while IFS= read -r line; do
              printf '::error::%s\n' "${line//$'\r'/}"
            done
            {
              echo "### Ошибки сборки"
              echo '```'
              grep -nE "error:|\*\* ARCHIVE FAILED" build/xcodebuild.log | head -60 || true
              echo '```'
              echo "### Хвост лога"
              echo '```'
              tail -60 build/xcodebuild.log || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY" || true
          else
            echo "::error::лог сборки не найден"
          fi
          exit 0

      - name: Package IPA
        run: |
          cd build
          mkdir -p Payload
          cp -R UltraTools.xcarchive/Products/Applications/UltraTools.app Payload/
          zip -qry UltraTools-unsigned.ipa Payload
          ls -la

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: UltraTools-unsigned-ipa
          path: build/UltraTools-unsigned.ipa

      - name: Publish IPA to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.3"
          NOTES=$'Готовый файл приложения **UltraTools**.\n\nКак установить на iPhone:\n1. Скачайте файл **UltraTools-unsigned.ipa** ниже (раздел Assets).\n2. Установите на компьютер [AltStore](https://altstore.io) или [Sideloadly](https://sideloadly.io).\n3. Войдите под своим Apple ID и перетащите туда скачанный .ipa.\n4. Приложение появится на iPhone. Требуется iOS 16.2+.'
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" \
              --title "UltraTools v1.3" \
              --notes "$NOTES" \
              --target "${{ github.sha }}"
          gh release upload "$TAG" build/UltraTools-unsigned.ipa --clobber
          echo "Скачать: ${{ github.server_url }}/${{ github.repository }}/releases/download/$TAG/UltraTools-unsigned.ipa"
