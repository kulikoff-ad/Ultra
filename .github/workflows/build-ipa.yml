name: Build UltraTools IPA

on:
  push:
    branches: [main, "arena/**"]
  workflow_dispatch: {}

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Archive
        run: |
          xcodebuild \
            -project UltraTools.xcodeproj \
            -scheme UltraTools \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/UltraTools.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          cd build
          mkdir -p Payload
          cp -R UltraTools.xcarchive/Products/Applications/UltraTools.app Payload/
          zip -qry UltraTools-unsigned.ipa Payload
          ls -la

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: UltraTools-unsigned-ipa
          path: build/UltraTools-unsigned.ipa
